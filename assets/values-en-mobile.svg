<svg xmlns="http://www.w3.org/2000/svg" width="400" height="168" viewBox="0 0 400 168" role="img" aria-labelledby="title desc">
<title id="title">Test-cohort accuracy</title>
<desc id="desc">Illustrative values on identical 0 to 100 percent scales: proposed method 87.4%, baseline model 81.2%.</desc>
<style>
:root {
  --paper:#fff; --ink:#302d40; --soft:#625e73;
  --violet:#634f81; --old:#795e68; --hair:#d9d4e2; --graph:#aa9ebd;
  --bloom:#e9e4f2; --silk:#a08bb8; --glint:#c6b9d3; --echo:#b9a39c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper:#0d1117; --ink:#eeeaf1; --soft:#c0bbc9;
    --violet:#cfbce6; --old:#d4b7c1; --hair:#494858; --graph:#a699b8;
    --bloom:#292637; --silk:#88799f; --glint:#ad9ac3; --echo:#ad9596;
  }
}
</style>
<rect width="400" height="168" fill="var(--paper)"/>
<text x="12" y="27" fill="var(--soft)" font-family="Baskerville,'Iowan Old Style','Palatino Linotype',Georgia,'Songti SC',serif" font-size="16" >Accuracy in the test cohort</text>
<text x="12" y="84" fill="var(--violet)" font-family="Baskerville,'Iowan Old Style','Palatino Linotype',Georgia,'Songti SC',serif" font-size="43" >87.4%</text>
<text x="14" y="109" fill="var(--soft)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" >Proposed method</text>
<path d="M12 139L172 139" stroke="var(--hair)" stroke-width="1" fill="none"/>
<path d="M12 139L151.84 139" stroke="var(--graph)" stroke-width="1.6" fill="none"/>
<circle cx="151.84" cy="139" r="3.8" fill="var(--violet)" stroke="var(--violet)" stroke-width="1.5"/>
<text x="213" y="84" fill="var(--ink)" font-family="Baskerville,'Iowan Old Style','Palatino Linotype',Georgia,'Songti SC',serif" font-size="43" >81.2%</text>
<text x="215" y="109" fill="var(--soft)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" >Baseline model</text>
<path d="M213 139L373 139" stroke="var(--hair)" stroke-width="1" fill="none"/>
<path d="M213 139L342.91999999999996 139" stroke="var(--graph)" stroke-width="1.6" fill="none"/>
<circle cx="342.92" cy="139" r="3.8" fill="var(--paper)" stroke="var(--soft)" stroke-width="1.5"/>
</svg>
