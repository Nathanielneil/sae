<svg xmlns="http://www.w3.org/2000/svg" width="920" height="213" viewBox="0 0 920 213" role="img" aria-labelledby="title desc">
  <title id="title">编辑判断</title>
  <desc id="desc">Edit language directly; query concrete conflicts when permitted; retain claims when context is missing.</desc>
