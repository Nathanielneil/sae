<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">SAE — Standard Academic Editing</title>
  <desc id="desc">Evidence-calibrated English editing for scientific manuscripts.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081629"/>
      <stop offset="0.58" stop-color="#102d46"/>
      <stop offset="1" stop-color="#0a4b59"/>
    </linearGradient>
    <radialGradient id="blue-glow" cx="0" cy="1" r="1">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="green-glow" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8c7"/>
      <stop offset="1" stop-color="#70b7ff"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#c7e2ec" stroke-opacity="0.055"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="360" rx="26"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#background)"/>
    <rect width="1200" height="360" fill="url(#blue-glow)"/>
    <rect width="1200" height="360" fill="url(#green-glow)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>

    <g transform="translate(72 56)">
      <circle cx="5" cy="12" r="5" fill="#67e8c7"/>
      <text x="20" y="17" fill="#83efd6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="1.5">CODEX SKILL</text>

      <text x="0" y="118" fill="#f5fbff" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="78" font-weight="760" letter-spacing="-3">SAE</text>
      <rect x="0" y="133" width="168" height="5" rx="2.5" fill="url(#accent)"/>
      <text x="0" y="181" fill="#d8eaf2" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="27" font-weight="650">Standard Academic Editing</text>
      <text x="0" y="221" fill="#a9c7d5" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">Polish the prose. Preserve the science.</text>
    </g>

    <g transform="translate(690 45)">
      <rect width="438" height="270" rx="22" fill="#061522" fill-opacity="0.7" stroke="#b9dce6" stroke-opacity="0.17"/>

      <g transform="translate(26 24)">
        <circle cx="5" cy="5" r="5" fill="#ff7d79"/>
        <circle cx="23" cy="5" r="5" fill="#f3c967"/>
        <circle cx="41" cy="5" r="5" fill="#68d5a5"/>
      </g>

      <g transform="translate(28 68)">
        <rect width="72" height="24" rx="12" fill="#f87171" fill-opacity="0.11"/>
        <text x="36" y="16" text-anchor="middle" fill="#f49a95" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1">BEFORE</text>
        <text x="0" y="55" fill="#da9390" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">may potentially improve</text>
        <line x1="0" y1="49" x2="198" y2="49" stroke="#f08480" stroke-width="1.5" stroke-opacity="0.8"/>
      </g>

      <path d="M28 151H410" stroke="#b9dce6" stroke-opacity="0.12"/>

      <g transform="translate(28 171)">
        <rect width="64" height="24" rx="12" fill="#67e8c7" fill-opacity="0.11"/>
        <text x="32" y="16" text-anchor="middle" fill="#81e8d0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1">AFTER</text>
        <text x="0" y="55" fill="#eef8fb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">Improved under tested conditions.</text>
        <text x="0" y="82" fill="#78dac4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">87.4%</text>
        <text x="61" y="82" fill="#7793a1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">vs</text>
        <text x="84" y="82" fill="#78dac4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">81.2%</text>
        <text x="138" y="82" fill="#7793a1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">· data unchanged</text>
      </g>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="25.25" fill="none" stroke="#c6e4eb" stroke-opacity="0.08" stroke-width="1.5"/>
</svg>
