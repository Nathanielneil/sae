<svg xmlns="http://www.w3.org/2000/svg" width="400" height="176" viewBox="0 0 400 176" role="img" aria-labelledby="title desc">
<title id="title">如何选择编辑方式</title>
<desc id="desc">Edit language directly, query concrete conflicts when allowed, and preserve a claim when context is missing.</desc>
<style>
:root {
  --paper:#fff; --ink:#302d40; --soft:#625e73;
  --violet:#634f81; --old:#795e68; --hair:#d9d4e2; --graph:#aa9ebd;
  --bloom:#e9e4f2; --silk:#a08bb8; --glint:#c6b9d3; --echo:#b9a39c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper:#0d1117; --ink:#eeeaf1; --soft:#c0bbc9;
    --violet:#cfbce6; --old:#d4b7c1; --hair:#494858; --graph:#a699b8;
    --bloom:#292637; --silk:#88799f; --glint:#ad9ac3; --echo:#ad9596;
  }
}
</style>
<rect width="400" height="176" fill="var(--paper)"/>
<path d="M12 88C30 88 23 37 49 37" fill="none" stroke="var(--graph)" stroke-width="1" opacity="1" stroke-linecap="round"/>
<circle cx="50" cy="37" r="2.8" fill="var(--paper)" stroke="var(--graph)" stroke-width="1.5"/>
<text x="64" y="43" fill="var(--soft)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" >措辞问题</text>
<text x="233" y="44" fill="var(--violet)" font-family="Baskerville,'Iowan Old Style','Palatino Linotype',Georgia,'Songti SC',serif" font-size="19" >直接编辑</text>
<path d="M12 88C30 88 23 88 49 88" fill="none" stroke="var(--graph)" stroke-width="1" opacity="1" stroke-linecap="round"/>
<circle cx="50" cy="88" r="2.8" fill="var(--paper)" stroke="var(--graph)" stroke-width="1.5"/>
<text x="64" y="94" fill="var(--soft)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" >证据冲突</text>
<text x="233" y="95" fill="var(--violet)" font-family="Baskerville,'Iowan Old Style','Palatino Linotype',Georgia,'Songti SC',serif" font-size="19" >向作者确认</text>
<path d="M12 88C30 88 23 139 49 139" fill="none" stroke="var(--graph)" stroke-width="1" opacity="1" stroke-linecap="round"/>
<circle cx="50" cy="139" r="2.8" fill="var(--paper)" stroke="var(--graph)" stroke-width="1.5"/>
<text x="64" y="145" fill="var(--soft)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" >缺少上下文</text>
<text x="233" y="146" fill="var(--violet)" font-family="Baskerville,'Iowan Old Style','Palatino Linotype',Georgia,'Songti SC',serif" font-size="19" >保留原主张</text>
</svg>
