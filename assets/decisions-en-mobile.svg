<svg xmlns="http://www.w3.org/2000/svg" width="400" height="168" viewBox="0 0 400 168" role="img" aria-labelledby="title desc">
<title id="title">Choosing an edit</title>
<desc id="desc">Edit language directly, query concrete conflicts when allowed, and preserve a claim when context is missing.</desc>
<style>
:root {
  --paper:#fff; --ink:#302d40; --soft:#625e73;
  --violet:#634f81; --old:#795e68; --hair:#d9d4e2; --graph:#aa9ebd;
  --bloom:#e9e4f2; --silk:#a08bb8; --glint:#c6b9d3; --echo:#b9a39c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper:#0d1117; --ink:#eeeaf1; --soft:#c0bbc9;
    --violet:#cfbce6; --old:#d4b7c1; --hair:#494858; --graph:#a699b8;
    --bloom:#292637; --silk:#88799f; --glint:#ad9ac3; --echo:#ad9596;
  }
}
</style>
<rect width="400" height="168" fill="var(--paper)"/>
<path d="M2 84C17.66 84 16.5 35 31 35" fill="none" stroke="var(--graph)" stroke-width="1" opacity="1" stroke-linecap="round"/>
<circle cx="31" cy="35" r="2.8" fill="var(--paper)" stroke="var(--graph)" stroke-width="1.5"/>
<text x="44" y="35" fill="var(--soft)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" dominant-baseline="central">Language only</text>
<text x="234" y="35" fill="var(--violet)" font-family="Baskerville,'Iowan Old Style','Palatino Linotype',Georgia,'Songti SC',serif" font-size="19" dominant-baseline="central">Edit directly</text>
<path d="M2 84C17.66 84 16.5 84 31 84" fill="none" stroke="var(--graph)" stroke-width="1" opacity="1" stroke-linecap="round"/>
<circle cx="31" cy="84" r="2.8" fill="var(--paper)" stroke="var(--graph)" stroke-width="1.5"/>
<text x="44" y="84" fill="var(--soft)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" dominant-baseline="central">Conflicting evidence</text>
<text x="234" y="84" fill="var(--violet)" font-family="Baskerville,'Iowan Old Style','Palatino Linotype',Georgia,'Songti SC',serif" font-size="19" dominant-baseline="central">Ask the author</text>
<path d="M2 84C17.66 84 16.5 133 31 133" fill="none" stroke="var(--graph)" stroke-width="1" opacity="1" stroke-linecap="round"/>
<circle cx="31" cy="133" r="2.8" fill="var(--paper)" stroke="var(--graph)" stroke-width="1.5"/>
<text x="44" y="133" fill="var(--soft)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" dominant-baseline="central">Missing context</text>
<text x="234" y="133" fill="var(--violet)" font-family="Baskerville,'Iowan Old Style','Palatino Linotype',Georgia,'Songti SC',serif" font-size="19" dominant-baseline="central">Keep the claim</text>
</svg>
