<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc">
  <title id="title">SAE — Standard Academic Editing</title>
  <desc id="desc">Clear prose. Intact meaning. A restrained editorial masthead in deep green and warm ivory.</desc>
  <rect width="1100" height="300" rx="12" fill="#f5f3ed"/>
  <rect x="0.5" y="0.5" width="1099" height="299" rx="11.5" fill="none" stroke="#dedfd5"/>
  <path d="M52 48H1048" stroke="#244b40" stroke-width="1.5"/>
  <g fill="#244b40">
    <text x="52" y="79" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2.2">SCIENTIFIC ENGLISH</text>
    <text x="1048" y="79" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2.2">CODEX SKILL</text>
    <text x="46" y="205" font-family="Georgia, 'Times New Roman', serif" font-size="126" letter-spacing="-6">SAE</text>
    <text x="604" y="148" font-family="Georgia, 'Times New Roman', serif" font-size="39">Clear prose.</text>
    <text x="604" y="197" font-family="Georgia, 'Times New Roman', serif" font-size="39">Intact meaning.</text>
  </g>
  <path d="M547 110V207" stroke="#ccd2c6"/>
