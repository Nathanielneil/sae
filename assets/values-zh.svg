<svg xmlns="http://www.w3.org/2000/svg" width="920" height="185" viewBox="0 0 920 185" role="img" aria-labelledby="title desc">
<title id="title">测试队列中的准确率</title>
<desc id="desc">Illustrative values on identical 0 to 100 percent scales: proposed method 87.4%, baseline model 81.2%.</desc>
<style>
:root {
  --paper:#fff; --ink:#302d40; --soft:#625e73;
  --violet:#634f81; --old:#795e68; --hair:#d9d4e2; --graph:#aa9ebd;
  --bloom:#e9e4f2; --silk:#a08bb8; --glint:#c6b9d3; --echo:#b9a39c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper:#0d1117; --ink:#eeeaf1; --soft:#c0bbc9;
    --violet:#cfbce6; --old:#d4b7c1; --hair:#494858; --graph:#a699b8;
    --bloom:#292637; --silk:#88799f; --glint:#ad9ac3; --echo:#ad9596;
  }
}
</style>
<rect width="920" height="185" fill="var(--paper)"/>
<text x="30" y="36" fill="var(--soft)" font-family="Baskerville,'Iowan Old Style','Palatino Linotype',Georgia,'Songti SC',serif" font-size="19" >测试队列中的准确率</text>
<text x="30" y="105" fill="var(--violet)" font-family="Baskerville,'Iowan Old Style','Palatino Linotype',Georgia,'Songti SC',serif" font-size="59" >87.4%</text>
<text x="32" y="134" fill="var(--soft)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" >所提方法</text>
<path d="M30 163L388 163" stroke="var(--hair)" stroke-width="1" fill="none"/>
<path d="M30 163L342.892 163" stroke="var(--graph)" stroke-width="1.6" fill="none"/>
<circle cx="342.89" cy="163" r="3.8" fill="var(--violet)" stroke="var(--violet)" stroke-width="1.5"/>
<text x="484" y="105" fill="var(--ink)" font-family="Baskerville,'Iowan Old Style','Palatino Linotype',Georgia,'Songti SC',serif" font-size="59" >81.2%</text>
<text x="486" y="134" fill="var(--soft)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" >基线模型</text>
<path d="M484 163L842 163" stroke="var(--hair)" stroke-width="1" fill="none"/>
<path d="M484 163L774.696 163" stroke="var(--graph)" stroke-width="1.6" fill="none"/>
<circle cx="774.7" cy="163" r="3.8" fill="var(--paper)" stroke="var(--soft)" stroke-width="1.5"/>
</svg>
