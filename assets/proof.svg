<svg xmlns="http://www.w3.org/2000/svg" width="920" height="208" viewBox="0 0 920 208" role="img" aria-labelledby="title desc">
<title id="title">Original and edited manuscript excerpt</title>
<desc id="desc">Of course is deleted. Do not establish is retained: the result does not establish full replacement.</desc>
<style>
:root {
  --paper:#fff; --ink:#302d40; --soft:#625e73;
  --violet:#634f81; --old:#795e68; --hair:#d9d4e2; --graph:#aa9ebd;
  --bloom:#e9e4f2; --silk:#a08bb8; --glint:#c6b9d3; --echo:#b9a39c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper:#0d1117; --ink:#eeeaf1; --soft:#c0bbc9;
    --violet:#cfbce6; --old:#d4b7c1; --hair:#494858; --graph:#a699b8;
    --bloom:#292637; --silk:#88799f; --glint:#ad9ac3; --echo:#ad9596;
  }
}
</style>
<rect width="920" height="208" fill="var(--paper)"/>
<path d="M20 11L900 11" stroke="var(--hair)" stroke-width="1" fill="none"/>
<path d="M20 197L900 197" stroke="var(--hair)" stroke-width="1" fill="none"/>
<text x="30" y="50" fill="var(--soft)" font-family="Baskerville,'Iowan Old Style','Palatino Linotype',Georgia,'Songti SC',serif" font-size="19" font-style="italic">Original</text>
<text x="30" y="92" font-size="24" font-family="Baskerville,'Iowan Old Style','Palatino Linotype',Georgia,'Songti SC',serif" fill="var(--ink)"><tspan fill="var(--old)" text-decoration="line-through">Of course,</tspan> these results do not</text>
<text x="30" y="126" font-size="24" font-family="Baskerville,'Iowan Old Style','Palatino Linotype',Georgia,'Songti SC',serif" fill="var(--ink)">establish that the method can fully</text>
<text x="30" y="160" font-size="24" font-family="Baskerville,'Iowan Old Style','Palatino Linotype',Georgia,'Songti SC',serif" fill="var(--ink)">replace conventional methods.</text>
<text x="489" y="50" fill="var(--violet)" font-family="Baskerville,'Iowan Old Style','Palatino Linotype',Georgia,'Songti SC',serif" font-size="19" font-style="italic">Edited</text>
<text x="489" y="92" font-size="24" font-family="Baskerville,'Iowan Old Style','Palatino Linotype',Georgia,'Songti SC',serif" fill="var(--ink)">These results <tspan fill="var(--violet)" text-decoration="underline">do not establish</tspan></text>
<text x="489" y="126" font-size="24" font-family="Baskerville,'Iowan Old Style','Palatino Linotype',Georgia,'Songti SC',serif" fill="var(--ink)">that the method can fully replace</text>
<text x="489" y="160" font-size="24" font-family="Baskerville,'Iowan Old Style','Palatino Linotype',Georgia,'Songti SC',serif" fill="var(--ink)">conventional methods.</text>
<path d="M434 115q10-3 23-1m-6-4 6 4-6 4" fill="none" stroke="var(--graph)" stroke-width="1.1" opacity="1" stroke-linecap="round"/>
</svg>
