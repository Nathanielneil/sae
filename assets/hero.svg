  <text x="52" y="268" fill="#52665a" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2">STANDARD ACADEMIC EDITING</text>
  <g stroke="#6f8b73" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M1008 258h12m-6-6v12M1036 252v12m-6-6h12"/>
